name: Release

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `changeset publish` shells out to `pnpm publish` in a pnpm workspace, so
      # trusted publishing (OIDC) rides on pnpm's implementation, not npm's.
      # No NPM_TOKEN is involved. `id-token: write` above is what makes it work.
      # v2 renamed every input this step uses: `version` to `version-script`,
      # `publish` to `publish-script`, `title` to `pr-title`, `commit` to
      # `commit-message`, and the GITHUB_TOKEN env var to a `github-token`
      # input. The old names are silently ignored, not rejected.
      - id: changesets
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm changeset version
          publish-script: pnpm release
          pr-title: "chore: release"
          commit-message: "chore: release"

      # Merging is what triggers the run that publishes, and a merge performed
      # with GITHUB_TOKEN does not start a new workflow run — the release would
      # silently never happen. RELEASE_PAT exists only to make this one merge
      # look like a human push. Publishing still goes over OIDC; no npm token
      # is stored anywhere.
      #
      # A plain merge rather than `--auto`: the `main` ruleset requires no
      # status checks, so the PR is mergeable the moment it opens and GitHub
      # rejects auto-merge on an already-mergeable PR. Nothing is lost, because
      # the publish run that follows is still gated on all four CI jobs.
      #
      # The PR number goes through `env` rather than straight into the shell
      # line: an expression interpolated into `run:` is substituted as text
      # before the shell sees it, which is how script injection gets in.
      - if: steps.changesets.outputs.pr-number
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: gh pr merge --squash --delete-branch "$PR_NUMBER"

      # Consumers pin `@v1`. Move it to whatever was just released so they pick
      # up workflow and action changes without editing every caller.
      - if: steps.changesets.outputs.published == 'true'
        run: |
          git tag --force v1
          git push --force origin v1
